name: CI

# Runs on every pull request and on main. On a pull request it only checks. A
# push to main whose checks all pass is published and deployed: publish.yml
# tests its image and pushes it to GHCR, for the compose stack, and deploy.yml
# deploys the very build the checks passed to staging. Releases come from
# release.yml, on version tags, which runs these same checks by calling this
# workflow.
#
# The end-to-end tests run the build against a real AIshie Core: the one
# pinned in .github/core-image, pulled from GHCR, and api/catalogue.json must
# be that Core's tool catalogue.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * 1" # weekly, so new advisories surface without a push
  workflow_dispatch:
  workflow_call:

# A newer push to a pull request makes the older run moot. Every push to main
# is checked in a run of its own, which nothing waits for or cancels: waiting
# would hold the next commit's checks back until this one is deployed, and a
# waiting run is cancelled when another joins the group. publish.yml and
# deploy.yml put the publishing and the deploys in order. The workflow's name
# keeps a release's run of these checks apart from main's run of the same
# commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Each run block is bash with -o pipefail: a pipeline fails when any command
# in it does, not only when its last one does.
defaults:
  run:
    shell: bash

env:
  ACTIONLINT_VERSION: v1.7.12
  # The ShellCheck people lint with (brew install shellcheck), not the
  # runner's: ubuntu-24.04 has 0.9.0, which reports what 0.11.0 lets pass,
  # so a script clean on a laptop would fail here. To move it, the new
  # version and the SHA-256 of its linux.x86_64.tar.xz (the release's page
  # lists it).
  SHELLCHECK_VERSION: v0.11.0
  SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198

jobs:
  check:
    name: checks and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      # src/api/generated is made from api/catalogue.json, and nobody edits
      # it: made again, it must come out the same.
      - name: Generated API types are current
        run: |
          npm run gen:api
          if ! git diff --exit-code -- src/api/generated || [ -n "$(git status --porcelain -- src/api/generated)" ]; then
            echo "::error::src/api/generated is not what npm run gen:api makes of api/catalogue.json: run it, and commit what it writes"
            exit 1
          fi
      - run: npm run typecheck
      - run: npm run check:i18n
      - run: npm test
      - run: npm run build
      # The one build. The end-to-end tests run on these files, and a deploy
      # ships them: nothing is built again on the way.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-${{ github.sha }}
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
          overwrite: true # a re-run builds the same commit again

  scripts:
    name: workflows and deploy scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      # First on PATH, for the steps after this one: actionlint runs it too.
      - name: ShellCheck ${{ env.SHELLCHECK_VERSION }}
        run: |
          name=shellcheck-$SHELLCHECK_VERSION.linux.x86_64.tar.xz
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$name" \
            "https://github.com/koalaman/shellcheck/releases/download/$SHELLCHECK_VERSION/$name"
          echo "$SHELLCHECK_SHA256  $RUNNER_TEMP/$name" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$name" -C "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/bin"
          mv "$RUNNER_TEMP/shellcheck-$SHELLCHECK_VERSION/shellcheck" "$RUNNER_TEMP/bin/"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/shellcheck" --version
      # actionlint also runs shellcheck over every run: block.
      - name: actionlint
        run: go run "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"
      - name: shellcheck
        run: |
          shellcheck -s sh deploy/aishie-web-deploy deploy/setup-web.sh scripts/pack-dist.sh
          shellcheck deploy/aishie-web-deploy_test.sh scripts/ci-core.sh scripts/test-image.sh
      # On Ubuntu, like the server: GNU tar and mv, and dash as /bin/sh.
      - run: deploy/aishie-web-deploy_test.sh

  audit:
    name: npm audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # What reaches browsers only: the dependencies the build bundles. A dev
      # tool's advisory is about the machine that runs it.
      - run: npm audit --omit=dev --audit-level=high

  # The image, built for this machine and tested (scripts/test-image.sh): it
  # must serve the build check made, file for file, by the rules
  # deploy/setup-web.sh's site has. On a push nothing is built here: a push
  # publishes, and publish.yml (main) or release.yml (a tag) tests the image it
  # is about to push, as this does. Plain docker, and actions/* only, as the
  # rest of a pull request's checks.
  image:
    name: the image
    needs: check
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # git describe needs the tags
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-${{ github.sha }}
          path: ${{ runner.temp }}/dist
      - id: meta
        name: Version and commit
        run: |
          {
            echo "version=$(git describe --tags --always)"
            echo "commit=${GITHUB_SHA:0:7}"
          } | tee -a "$GITHUB_OUTPUT"
      - name: Build
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          COMMIT: ${{ steps.meta.outputs.commit }}
        run: docker build --build-arg VERSION="$VERSION" --build-arg COMMIT="$COMMIT" -t aishie-frontend:test .
      - name: Test the image
        env:
          EXPECT_VERSION: ${{ steps.meta.outputs.version }}
          EXPECT_COMMIT: ${{ steps.meta.outputs.commit }}
        run: scripts/test-image.sh aishie-frontend:test "$RUNNER_TEMP/dist"

  # The build check made, served by vite preview, against the pinned Core on a
  # scratch database. Core's catalogue is checked here too, while it is up:
  # starting it is most of this job, and minutes are counted.
  e2e:
    name: end to end, and Core's catalogue
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read # Core's image, which is private
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      # scripts/ci-core.sh creates it for Core, and Core alone uses it.
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/aishie_e2e?sslmode=disable
      E2E_PREVIEW: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-${{ github.sha }}
          path: dist
      # The package is private: this works once an organization owner has let
      # this repository read it (CONTRIBUTING.md, One-time settings), and
      # scripts/ci-core.sh says so when the pull is refused.
      - name: Log in to GHCR
        env:
          TOKEN: ${{ github.token }}
        run: printf '%s\n' "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - id: core
        name: Start Core (.github/core-image)
        run: scripts/ci-core.sh start
      - name: Core's tool catalogue is api/catalogue.json
        run: |
          if ! npm run --silent gen:api -- --from "$E2E_CORE_URL" --check; then
            pin=$(grep -v -e '^#' -e '^[[:space:]]*$' .github/core-image | tail -n 1)
            echo "::error::api/catalogue.json is not the tool catalogue of the Core pinned in .github/core-image ($pin). Refresh it from that Core, with its types, or pin the Core it came from (README, Moving the Core pin)."
            exit 1
          fi
      # The tests run even when the catalogue differs: both are worth knowing.
      - id: playwright
        name: Playwright's version
        if: ${{ !cancelled() && steps.core.outcome == 'success' }}
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !cancelled() && steps.core.outcome == 'success' }}
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      # The browser comes from the cache when it can; the system libraries it
      # needs are checked every time.
      - name: Install Chromium
        if: ${{ !cancelled() && steps.core.outcome == 'success' }}
        run: npx playwright install --with-deps chromium
      - name: Playwright
        if: ${{ !cancelled() && steps.core.outcome == 'success' }}
        run: npx playwright test
      - name: Stop Core
        if: always()
        run: scripts/ci-core.sh stop
      # Traces hold the throwaway Core's sessions and agents' tokens, which died with it.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: e2e-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
            ${{ runner.temp }}/aishie-ci-core/core.log
          if-no-files-found: ignore
          retention-days: 14

  # A green push to main: its image, tested and pushed to GHCR as :sha-<commit>,
  # and :edge while it is main's tip. Pull requests, the weekly run and a
  # release's run of these checks publish nothing here (release.yml publishes
  # a release's image). audit does not hold it back: a new advisory is for a
  # person to weigh, and it still shows red here.
  publish:
    needs: [check, scripts, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish.yml

  # A green push to main: the build its checks passed, deployed to staging.
  # Pull requests, the weekly run and a release's run of these checks deploy
  # nothing. audit does not hold it back: a new advisory is for a person to
  # weigh, and it still shows red here.
  deploy-staging:
    needs: [check, scripts, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      artifact: web-${{ github.sha }}
    # A called workflow sees no secret its caller does not pass: see deploy.yml.
    secrets: inherit
