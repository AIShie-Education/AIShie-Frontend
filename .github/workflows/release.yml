name: Release

# The only place a release is made, and it runs on version tags only, from
# main:
#
#   git tag -s v0.1.0 -m "v0.1.0" && git push origin v0.1.0
#
# It checks the tagged commit again, all of CI (ci.yml, called), then
# publishes its image in GHCR, tested first against the build those checks
# passed (scripts/test-image.sh), and that build on the release page: a
# tarball of dist/, its SHA-256, and notes that say which Core it was checked
# against and which image is the release's. A tag with a hyphen (v0.1.0-rc.1)
# is a pre-release: its image gets its own version tag and nothing else, and
# it is deployed to staging through deploy.yml. A stable release is not
# deployed by itself: production is deployed by running the Deploy workflow by
# hand, from the tag, and the run's summary says how.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/aishie-education/aishie-frontend

# Each run block is bash with -o pipefail: a pipeline fails when any command
# in it does, not only when its last one does.
defaults:
  run:
    shell: bash

jobs:
  tag:
    name: the tag is on main
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: |
          [[ $GITHUB_REF_NAME =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] \
            || { echo "::error::$GITHUB_REF_NAME is not a version tag, like v1.2.3 or v1.2.3-rc.1"; exit 1; }
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME does not point at a commit on main"; exit 1; }

  # A green run from last week proves nothing about this commit on today's
  # runners, so everything CI checks is checked again, on the tagged commit,
  # and its build is the one released.
  ci:
    needs: tag
    permissions:
      contents: read
      # The end-to-end tests pull Core's image (read). ci.yml's publish job
      # asks for write, and runs on a push to main only, never here; but a
      # called workflow's jobs may ask for no more than their caller gives,
      # whether they run or not.
      packages: write
    uses: ./.github/workflows/ci.yml

  # The image of the build CI checked, for the compose stack (AIShie-Deploy):
  # tested first, then pushed as X.Y.Z and X.Y, and as latest when this is the
  # highest stable release; a pre-release as X.Y.Z-rc.N only. Nothing in its
  # last stage runs a command, so the second architecture needs no emulation.
  image:
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write
      attestations: write
    outputs:
      image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the tags, to know the highest release
      # latest is the highest stable release, said each time: a fix to an
      # older line is not the latest, as on the release page.
      - id: what
        name: Commit, and whether this is the latest
        run: |
          top=$(git tag --list 'v[0-9]*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
          {
            echo "commit=${GITHUB_SHA:0:7}"
            if [ "$top" = "$GITHUB_REF_NAME" ]; then echo "latest=true"; else echo "latest=false"; fi
          } | tee -a "$GITHUB_OUTPUT"
      # The build CI checked, which the image must serve file for file.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-${{ github.sha }}
          path: ${{ runner.temp }}/dist
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # 1.2.3 and 1.2 for a stable release; a pre-release only 1.2.3-rc.1.
          flavor: latest=${{ steps.what.outputs.latest }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          # The version /version.json says, the tag as it was pushed, as on
          # main (git describe).
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}
      # For this machine's Docker, to be tested before anything is pushed. The
      # push below builds the same again and takes this build's layers from
      # the builder's cache.
      - name: Build for the test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: aishie-frontend:test
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ steps.what.outputs.commit }}
          provenance: false
      - name: Test the image
        env:
          EXPECT_VERSION: ${{ github.ref_name }}
          EXPECT_COMMIT: ${{ steps.what.outputs.commit }}
          EXPECT_REVISION: ${{ github.sha }}
          EXPECT_SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: scripts/test-image.sh aishie-frontend:test "$RUNNER_TEMP/dist"
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ steps.what.outputs.commit }}
          provenance: mode=max
          sbom: true
      # The image pushed is the one tested: the same layers, for this
      # machine's architecture. Built twice, it is the builder's cache that
      # makes them so, and this says that it did, before the release is published.
      - name: The image pushed is the image tested
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          tested=$(docker image inspect aishie-frontend:test --format '{{json .RootFS.Layers}}' | jq -c .)
          pushed=$(docker buildx imagetools inspect "$IMAGE@$DIGEST" --format '{{json (index .Image "linux/amd64").RootFS.DiffIDs}}' | jq -c .)
          [ "$tested" = "$pushed" ] \
            || { echo "::error::$IMAGE@$DIGEST is not the image tested: its linux/amd64 layers are $pushed, the tested one's $tested"; exit 1; }
      # Artifact attestations need GitHub Enterprise Cloud on a private
      # repository, and would fail the run after the image is pushed. Set the
      # variable ATTESTATIONS to "true" where they are available.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ !github.event.repository.private || vars.ATTESTATIONS == 'true' }}
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # The release page, once its image is in GHCR.
  publish:
    needs: [ci, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the notes start at the tag before
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-${{ github.sha }}
          path: dist
      - name: Pack, and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_REF: ${{ needs.image.outputs.image }}
        run: |
          tag=$GITHUB_REF_NAME
          name=aishie-web-$tag.tar.gz
          scripts/pack-dist.sh dist "$name"
          sha256sum "$name" > "$name.sha256"
          # The notes cover what is new since the release before: for a stable
          # release, the stable one before, pre-releases included. The latest
          # release is the highest stable version, said each time: left to
          # itself, GitHub makes every new release the latest, a fix to an
          # older line too.
          flags=()
          if [[ $tag == *-* ]]; then
            flags=(--prerelease)
            prev=$(git describe --tags --abbrev=0 "$GITHUB_SHA^" 2>/dev/null || true)
          else
            prev=$(git tag --list 'v[0-9]*' --merged "$GITHUB_SHA" --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vxF "$tag" | head -n 1 || true)
            top=$(git tag --list 'v[0-9]*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
            if [ "$top" = "$tag" ]; then flags+=(--latest); else flags+=(--latest=false); fi
          fi
          if [ -n "$prev" ]; then flags+=(--notes-start-tag "$prev"); fi
          pin=$(grep -v -e '^#' -e '^[[:space:]]*$' .github/core-image | tail -n 1)
          core=${pin##*:sha-}
          core=${core%%@*}
          {
            echo "## Checked against AIshie Core $core"
            echo
            echo "Its end-to-end tests ran against \`$pin\`, and its API types are that Core's tool catalogue: deploy it beside that version of Core, or a later one that keeps its tools."
            echo
            echo "## Deploying"
            echo
            echo "The image \`$IMAGE:${tag#v}\` is this build, served on :8080, for the compose stack (AIShie-Deploy); it is \`$IMAGE_REF\`."
            echo
            echo "\`$name\` is the build (\`dist/\`), for a server set up with \`deploy/setup-web.sh\`: the Deploy workflow ships it (docs/deploying.md). \`$name.sha256\` is its checksum."
          } > "$RUNNER_TEMP/notes.md"
          if gh release view "$tag" > /dev/null 2>&1; then
            # A re-run: the release is there, perhaps without its files.
            gh release upload "$tag" "$name" "$name.sha256" --clobber
          else
            gh release create "$tag" "$name" "$name.sha256" --verify-tag --title "$tag" \
              --notes-file "$RUNNER_TEMP/notes.md" --generate-notes "${flags[@]}"
          fi

  # A pre-release goes to staging by itself, with the build its checks passed.
  staging:
    needs: publish
    if: contains(github.ref_name, '-')
    permissions:
      contents: read
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      artifact: web-${{ github.sha }}
    secrets: inherit # the deploy target's credentials: see deploy.yml

  # A stable release goes to production only when somebody runs Deploy for it.
  production:
    needs: [image, publish]
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: How to deploy it
        env:
          IMAGE_REF: ${{ needs.image.outputs.image }}
        run: |
          {
            echo "## $GITHUB_REF_NAME is released"
            echo
            echo "To deploy it to production: Actions → Deploy → Run workflow, with"
            echo
            echo "- Use workflow from: tag \`$GITHUB_REF_NAME\`"
            echo "- environment: \`production\`"
            echo "- ref: empty (or \`$GITHUB_REF_NAME\`)"
            echo
            echo "Deploy ships the release's own tarball, and says what it is before it goes on."
            echo
            echo "Its image, for the compose stack, is \`$IMAGE:${GITHUB_REF_NAME#v}\`: this run pushed it as \`$IMAGE_REF\`."
          } | tee -a "$GITHUB_STEP_SUMMARY"
