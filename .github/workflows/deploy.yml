name: Deploy

# The one place a build of the front end reaches an environment: edge, every
# green push to main, or stable, the releases schools run. ci.yml calls it for
# edge on every green push to main, and release.yml for edge on a pre-release
# tag, each with the build its checks passed. Stable is deployed by running
# it by hand, from a release's tag, and then takes that release's tarball, the
# one release.yml checked and published, and nothing else: not a build of
# main, nor a pre-release's, nor one made here. Those checks are this
# workflow's: the server deploys any build it is handed by whoever holds its
# key. Edge can be deployed by hand as well, with a build made here of any
# branch, tag or commit.
#
# A deploy target is a server that runs Core (Core's deploy/setup-server.sh)
# and has been set up with deploy/setup-web.sh (docs/deploying.md): Caddy
# serves the front end's files and sends /v1, /mcp and /healthz on to Core, on
# one origin. Once the repository variable DEPLOY_WEB_TARGET_EDGE (or
# _STABLE) names it, the deploy job connects to it with SSH, as a user that
# can do nothing but run deploy/aishie-web-deploy, and hands it the build as
# a tarball on standard input, with a release ID: a release's tag, or the
# commit. That script
# checks the archive, unpacks it beside the releases it keeps, and switches
# the site to it in one step. The job then asks the site, over HTTPS, whether
# it serves this build, and whether Core still answers behind it.
#
# Until an environment has a target, a run records the deployment in the
# environment and says which build is ready.
#
# The target, its host key and the SSH key are repository variables and a
# repository secret, one set per environment: a private repository on GitHub
# Free has no environment variables or secrets, and every plan has these. The
# job still names the environment, so whatever protection the environment has
# applies. Every workflow that calls this one passes `secrets: inherit`: a
# called workflow sees no secret its caller does not pass.
#
# Edge and stable were called staging and production before. Until a later
# release, which removes this, a setting not yet added by its new name is
# read by its old one (DEPLOY_WEB_*_STAGING, DEPLOY_WEB_*_PRODUCTION), with a
# warning that names the one to add, and an environment given by its old
# name is taken as the new one (docs/deploying.md, Settings from before the
# rename). GitHub's
# environments are not renamed with them: the first run for stable creates
# an environment of that name with no protection rules, unless it has been
# given production's first.

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      artifact:
        description: The artifact of this run that holds the build (dist/)
        type: string
        required: true
  workflow_dispatch:
    inputs:
      # A list of its own: the form offers only environments that exist, and
      # a private repository on GitHub Free may have none. GitHub takes no
      # value that is not in it, so the old names are not: plan takes them
      # from a caller only.
      environment:
        description: Where to deploy
        type: choice
        options: [edge, stable]
        required: true
      ref:
        description: "Edge: a branch, tag or commit to build, e.g. a release ID the server lists (empty: the one this runs from). Stable: a release's tag, v1.2.3 (empty: the tag this runs from)."
        type: string
        default: ""

permissions:
  contents: read

# Each run block is bash with -o pipefail: a pipeline fails when any command
# in it does, not only when its last one does.
defaults:
  run:
    shell: bash

jobs:
  # What is about to be deployed, said before any approval the environment
  # asks for, so that whoever approves can see it; and the tarball the deploy
  # job ships, made here, once.
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      environment: ${{ steps.what.outputs.environment }}
      deploy: ${{ steps.order.outputs.deploy }}
      id: ${{ steps.meta.outputs.id }}
      commit: ${{ steps.meta.outputs.commit }}
      entry: ${{ steps.meta.outputs.entry }}
      tarball: ${{ steps.meta.outputs.tarball }}
    steps:
      - id: what
        name: What to deploy
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          ARTIFACT: ${{ inputs.artifact }}
          WANT: ${{ inputs.ref }}
        run: |
          # The old names, until a later release: the rest of the run takes
          # the environment from here.
          case "$ENVIRONMENT" in
            edge | stable) ;;
            staging) echo "::warning::staging is called edge now: deploying to edge"; ENVIRONMENT=edge ;;
            production) echo "::warning::production is called stable now: deploying to stable"; ENVIRONMENT=stable ;;
            *) echo "::error::there is no environment $ENVIRONMENT: edge or stable"; exit 1 ;;
          esac
          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"
          # Stable first, whatever started this run: it takes a release's
          # tarball, by hand, from a release's tag, as a rollback does too.
          # Not a run's build, however it came to be passed here.
          if [ "$ENVIRONMENT" = stable ]; then
            [ -z "$ARTIFACT" ] \
              || { echo "::error::stable takes a release's tarball, deployed by running Deploy by hand from its tag, not a run's build ($ARTIFACT)"; exit 1; }
            [[ $GITHUB_REF_TYPE == tag && $GITHUB_REF_NAME =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
              || { echo "::error::stable is deployed from a release's tag, like v1.2.3, not from $GITHUB_REF_NAME"; exit 1; }
            tag=${WANT:-$GITHUB_REF_NAME}
            [[ $tag =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
              || { echo "::error::stable takes a release's tag, like v1.2.3, not $tag"; exit 1; }
            { echo "source=release"; echo "tag=$tag"; echo "ref=refs/tags/$tag"; } >> "$GITHUB_OUTPUT"
          elif [ -n "$ARTIFACT" ]; then
            # Called, with the build of this run's commit that its checks passed.
            { echo "source=artifact"; echo "ref=$GITHUB_SHA"; } >> "$GITHUB_OUTPUT"
          else
            want=${WANT:-$GITHUB_REF}
            [[ $want =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]] || { echo "::error::not a branch, tag or commit: $want"; exit 1; }
            # A pull request's head is anyone's code, from a fork: it is
            # reviewed and merged, never built here for a server.
            case $want in
              refs/pull/* | pull/*) echo "::error::a pull request's code is not deployed: give a branch, tag or commit of this repository"; exit 1 ;;
            esac
            if [[ $want =~ ^[0-9a-f]{7,40}$ ]]; then
              # A commit, whole or its first characters, as the server's
              # list names a release. checkout takes a commit only whole, so
              # it checks out every branch and tag, and the commit is looked
              # up among them after.
              { echo "source=build"; echo "ref="; echo "commit=$want"; } >> "$GITHUB_OUTPUT"
            else
              { echo "source=build"; echo "ref=$want"; } >> "$GITHUB_OUTPUT"
            fi
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.what.outputs.ref }}
          fetch-depth: 0 # git describe needs the tags
          persist-credentials: false
      - if: steps.what.outputs.commit != ''
        name: The commit
        env:
          WANT: ${{ steps.what.outputs.commit }}
        run: |
          commit=$(git rev-parse --verify --quiet "$WANT^{commit}") \
            || { echo "::error::no commit on a branch or tag of this repository is $WANT, or more than one starts so: give more of it"; exit 1; }
          git checkout --quiet --detach "$commit"
          echo "$WANT is $commit"

      - if: steps.what.outputs.source == 'artifact'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact }}
          path: dist

      # No npm cache: what a build of any ref installs is not written where
      # main's builds would restore it from.
      - if: steps.what.outputs.source == 'build'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - if: steps.what.outputs.source == 'build'
        name: Build
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - if: steps.what.outputs.source == 'release'
        name: The release's tarball
        env:
          TAG: ${{ steps.what.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          state=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq '"\(.isDraft) \(.isPrerelease)"') \
            || { echo "::error::$TAG has no release: release.yml publishes one for each version tag it passes"; exit 1; }
          [ "$state" = "false false" ] || { echo "::error::$TAG's release is a draft or a pre-release (draft, pre-release: $state)"; exit 1; }
          dir=$RUNNER_TEMP/release
          name=aishie-web-$TAG.tar.gz
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$dir" --pattern "$name" --pattern "$name.sha256"
          (cd "$dir" && sha256sum -c "$name.sha256")
          # Deployed as it was published; unpacked here only to be described.
          cp "$dir/$name" "$RUNNER_TEMP/web.tar.gz"
          mkdir dist
          tar -xzf "$RUNNER_TEMP/web.tar.gz" -C dist
      - if: steps.what.outputs.source != 'release'
        name: Pack the build
        run: scripts/pack-dist.sh dist "$RUNNER_TEMP/web.tar.gz"

      - id: meta
        name: What it is
        env:
          ENVIRONMENT: ${{ steps.what.outputs.environment }}
          SOURCE: ${{ steps.what.outputs.source }}
          ARTIFACT: ${{ inputs.artifact }}
          TAG: ${{ steps.what.outputs.tag }}
          REF: ${{ steps.what.outputs.commit || steps.what.outputs.ref }}
        run: |
          commit=$(git rev-parse HEAD)
          # The server keeps releases by this name: a release's tag for a
          # release's build, which activate then takes by that name, and the
          # commit for anything else.
          if [ "$SOURCE" = release ]; then
            id=$TAG
          elif [ "$SOURCE" = artifact ] && [ "$GITHUB_REF_TYPE" = tag ]; then
            id=$GITHUB_REF_NAME
          else
            id=$(git rev-parse --short=7 HEAD)
          fi
          version=$(git describe --tags --always)
          # What the site must load once it serves this build.
          entry=$(sed -n 's/.*<script type="module"[^>]* src="\([^"]*\)".*/\1/p' dist/index.html | head -n 1)
          [[ $entry == /assets/* ]] || { echo "::error::dist/index.html loads no script from /assets/"; exit 1; }
          case $SOURCE in
            artifact) from="the build this run's checks passed (artifact $ARTIFACT)" ;;
            release) from="the tarball of release $TAG" ;;
            build) from="a build of $REF, made here" ;;
          esac
          tarball=deploy-$ENVIRONMENT-$id
          {
            echo "id=$id"
            echo "commit=$commit"
            echo "entry=$entry"
            echo "tarball=$tarball"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Deploying to $ENVIRONMENT"
            echo
            echo "- commit: \`$commit\`, release ID \`$id\`"
            echo "- version: \`$version\`"
            echo "- from: $from"
            echo "- entry: \`$entry\`"
            echo "- $(find dist -type f | wc -l) files, $(du -sk dist | cut -f1) KiB; the tarball is $(stat -c %s "$RUNNER_TEMP/web.tar.gz") bytes, SHA-256 \`$(sha256sum "$RUNNER_TEMP/web.tar.gz" | cut -d' ' -f1)\`"
            echo
            echo "<details><summary>Files</summary>"
            echo
            echo '```'
            (cd dist && find . -type f -printf '%10s  %P\n' | sort -k2)
            echo '```'
            echo
            echo "</details>"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.meta.outputs.tarball }}
          path: ${{ runner.temp }}/web.tar.gz
          if-no-files-found: error
          retention-days: 14
          overwrite: true

      # A push to main is deployed while it is main's tip. A run that main has
      # moved past leaves edge to the newer commit's own run, so edge never
      # goes backwards; a re-run of one is refused outright.
      - id: order
        name: Not over a newer main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
            if [ "$tip" != "$GITHUB_SHA" ]; then
              if [ "$GITHUB_RUN_ATTEMPT" -gt 1 ]; then
                echo "::error::This re-run is for $GITHUB_SHA, and main has moved on to $tip: not deploying an older build over a newer one. To deploy again, run Deploy from main."
                exit 1
              fi
              echo "main has moved on to $tip, whose own run deploys it: this one stops here." | tee -a "$GITHUB_STEP_SUMMARY"
              echo "deploy=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: plan
    if: needs.plan.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # GitHub records the deployment here, and any protection the environment
    # has (required reviewers, allowed branches and tags) applies here.
    environment: ${{ needs.plan.outputs.environment }}
    # One deploy to an environment at a time, and never cancelled half way. A
    # deploy still waiting is cancelled when a newer one for the environment
    # comes, and the run that asked for it ends as cancelled.
    concurrency:
      group: deploy-frontend-${{ needs.plan.outputs.environment }}
      cancel-in-progress: false
    steps:
      - id: target
        name: The deploy target
        env:
          ENVIRONMENT: ${{ needs.plan.outputs.environment }}
          # Each setting by its own name: a secret indexed by a name made at
          # run time has every secret of the repository handed to the
          # runner. Only the environment's have a value. The _STAGING and
          # _PRODUCTION names are the ones they had before, read until a
          # later release.
          DEPLOY_WEB_TARGET_EDGE: ${{ needs.plan.outputs.environment == 'edge' && vars.DEPLOY_WEB_TARGET_EDGE || '' }}
          DEPLOY_WEB_TARGET_STAGING: ${{ needs.plan.outputs.environment == 'edge' && vars.DEPLOY_WEB_TARGET_STAGING || '' }}
          DEPLOY_WEB_TARGET_STABLE: ${{ needs.plan.outputs.environment == 'stable' && vars.DEPLOY_WEB_TARGET_STABLE || '' }}
          DEPLOY_WEB_TARGET_PRODUCTION: ${{ needs.plan.outputs.environment == 'stable' && vars.DEPLOY_WEB_TARGET_PRODUCTION || '' }}
          DEPLOY_WEB_KNOWN_HOSTS_EDGE: ${{ needs.plan.outputs.environment == 'edge' && vars.DEPLOY_WEB_KNOWN_HOSTS_EDGE || '' }}
          DEPLOY_WEB_KNOWN_HOSTS_STAGING: ${{ needs.plan.outputs.environment == 'edge' && vars.DEPLOY_WEB_KNOWN_HOSTS_STAGING || '' }}
          DEPLOY_WEB_KNOWN_HOSTS_STABLE: ${{ needs.plan.outputs.environment == 'stable' && vars.DEPLOY_WEB_KNOWN_HOSTS_STABLE || '' }}
          DEPLOY_WEB_KNOWN_HOSTS_PRODUCTION: ${{ needs.plan.outputs.environment == 'stable' && vars.DEPLOY_WEB_KNOWN_HOSTS_PRODUCTION || '' }}
          DEPLOY_WEB_URL_EDGE: ${{ needs.plan.outputs.environment == 'edge' && vars.DEPLOY_WEB_URL_EDGE || '' }}
          DEPLOY_WEB_URL_STAGING: ${{ needs.plan.outputs.environment == 'edge' && vars.DEPLOY_WEB_URL_STAGING || '' }}
          DEPLOY_WEB_URL_STABLE: ${{ needs.plan.outputs.environment == 'stable' && vars.DEPLOY_WEB_URL_STABLE || '' }}
          DEPLOY_WEB_URL_PRODUCTION: ${{ needs.plan.outputs.environment == 'stable' && vars.DEPLOY_WEB_URL_PRODUCTION || '' }}
          DEPLOY_WEB_SSH_KEY_EDGE: ${{ needs.plan.outputs.environment == 'edge' && secrets.DEPLOY_WEB_SSH_KEY_EDGE || '' }}
          DEPLOY_WEB_SSH_KEY_STAGING: ${{ needs.plan.outputs.environment == 'edge' && secrets.DEPLOY_WEB_SSH_KEY_STAGING || '' }}
          DEPLOY_WEB_SSH_KEY_STABLE: ${{ needs.plan.outputs.environment == 'stable' && secrets.DEPLOY_WEB_SSH_KEY_STABLE || '' }}
          DEPLOY_WEB_SSH_KEY_PRODUCTION: ${{ needs.plan.outputs.environment == 'stable' && secrets.DEPLOY_WEB_SSH_KEY_PRODUCTION || '' }}
          ID: ${{ needs.plan.outputs.id }}
          COMMIT: ${{ needs.plan.outputs.commit }}
          TARBALL: ${{ needs.plan.outputs.tarball }}
        run: |
          if [ "$ENVIRONMENT" = stable ]; then NAME=STABLE OLD=PRODUCTION; else NAME=EDGE OLD=STAGING; fi
          # A setting by its old name alone is taken, and said; by both, the
          # new one is. The Deploy step below reads them the same way.
          for setting in DEPLOY_WEB_TARGET DEPLOY_WEB_KNOWN_HOSTS DEPLOY_WEB_URL DEPLOY_WEB_SSH_KEY; do
            new=${setting}_$NAME old=${setting}_$OLD
            if [ -z "${!new}" ] && [ -n "${!old}" ]; then
              printf -v "$new" '%s' "${!old}"
              echo "::warning::$old is read by its old name: add $new, with the same value, then delete $old (docs/deploying.md, Settings from before the rename). A later release stops reading $old."
            elif [ -n "${!old}" ]; then
              echo "::notice::$new is set, and $old is no longer read: delete $old."
            fi
          done
          t=DEPLOY_WEB_TARGET_$NAME k=DEPLOY_WEB_KNOWN_HOSTS_$NAME u=DEPLOY_WEB_URL_$NAME s=DEPLOY_WEB_SSH_KEY_$NAME
          TARGET=${!t} KNOWN_HOSTS=${!k} SITE=${!u} SSH_KEY=${!s}
          if [ -z "$TARGET" ]; then
            # Half a configuration would otherwise pass as none, green.
            if [ -n "$SSH_KEY$KNOWN_HOSTS$SITE" ]; then
              echo "::error::DEPLOY_WEB_SSH_KEY_$NAME, DEPLOY_WEB_KNOWN_HOSTS_$NAME or DEPLOY_WEB_URL_$NAME is set, but the variable DEPLOY_WEB_TARGET_$NAME is not (a secret of that name is not read)"
              exit 1
            fi
            echo "No deploy target is configured for $ENVIRONMENT (DEPLOY_WEB_TARGET_$NAME); release $ID ($COMMIT) is ready, as this run's artifact $TARBALL." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ -n "$SSH_KEY" ] || { echo "::error::DEPLOY_WEB_TARGET_$NAME is set, but the secret DEPLOY_WEB_SSH_KEY_$NAME is not"; exit 1; }
          # Without the server's host key, nothing tells it from an impostor.
          [ -n "$KNOWN_HOSTS" ] || { echo "::error::DEPLOY_WEB_TARGET_$NAME is set, but DEPLOY_WEB_KNOWN_HOSTS_$NAME is not"; exit 1; }
          # user@host, or ssh://user@host:port; nothing ssh could take for an
          # option (-Fx@host would be -F x@host), so neither starts with a dash.
          [[ $TARGET =~ ^[A-Za-z0-9_][A-Za-z0-9._-]*@[A-Za-z0-9][A-Za-z0-9.-]*$ || $TARGET =~ ^ssh://[A-Za-z0-9_][A-Za-z0-9._-]*@[A-Za-z0-9][A-Za-z0-9.-]*(:[0-9]+)?$ ]] \
            || { echo "::error::DEPLOY_WEB_TARGET_$NAME is not user@host or ssh://user@host:port: $TARGET"; exit 1; }
          host=${TARGET#ssh://}
          host=${host#*@}
          host=${host%:*}
          site=${SITE:-https://$host}
          site=${site%/}
          [[ $site =~ ^https?://[A-Za-z0-9.-]+(:[0-9]+)?$ ]] \
            || { echo "::error::DEPLOY_WEB_URL_$NAME is not an origin, like https://lms.example.edu: $site"; exit 1; }
          # A commit or a version tag, and nothing the server's command line
          # could take for anything else.
          [[ $ID =~ ^[0-9a-f]{7,40}$ || $ID =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] \
            || { echo "::error::not a release ID: $ID"; exit 1; }
          { echo "configured=true"; echo "site=$site"; } >> "$GITHUB_OUTPUT"
      # plan checked this for a first attempt; main may have moved on while
      # this deploy waited for the one before it.
      - name: Still main's tip
        if: steps.target.outputs.configured == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          [ "$tip" = "$GITHUB_SHA" ] \
            || { echo "::error::main moved on to $tip while this deploy waited: not deploying an older build over a newer one (the newer commit's own run deploys it)"; exit 1; }
      - if: steps.target.outputs.configured == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.plan.outputs.tarball }}
          path: ${{ runner.temp }}/build
      - name: Deploy
        if: steps.target.outputs.configured == 'true'
        env:
          # As the step above reads them, by the new name or else the old
          # one; it has said which were old.
          TARGET: ${{ needs.plan.outputs.environment == 'stable' && (vars.DEPLOY_WEB_TARGET_STABLE || vars.DEPLOY_WEB_TARGET_PRODUCTION) || needs.plan.outputs.environment == 'edge' && (vars.DEPLOY_WEB_TARGET_EDGE || vars.DEPLOY_WEB_TARGET_STAGING) || '' }}
          KNOWN_HOSTS: ${{ needs.plan.outputs.environment == 'stable' && (vars.DEPLOY_WEB_KNOWN_HOSTS_STABLE || vars.DEPLOY_WEB_KNOWN_HOSTS_PRODUCTION) || needs.plan.outputs.environment == 'edge' && (vars.DEPLOY_WEB_KNOWN_HOSTS_EDGE || vars.DEPLOY_WEB_KNOWN_HOSTS_STAGING) || '' }}
          # Each key by its own name: a secret indexed by a name made at
          # run time has every secret of the repository handed to the
          # runner. Only the environment's has a value.
          SSH_KEY_EDGE: ${{ needs.plan.outputs.environment == 'edge' && (secrets.DEPLOY_WEB_SSH_KEY_EDGE || secrets.DEPLOY_WEB_SSH_KEY_STAGING) || '' }}
          SSH_KEY_STABLE: ${{ needs.plan.outputs.environment == 'stable' && (secrets.DEPLOY_WEB_SSH_KEY_STABLE || secrets.DEPLOY_WEB_SSH_KEY_PRODUCTION) || '' }}
          ID: ${{ needs.plan.outputs.id }}
        run: |
          SSH_KEY=$SSH_KEY_STABLE$SSH_KEY_EDGE
          # The key and host key live in a directory of their own, named on
          # the command line: ssh reads ~/.ssh from the passwd entry, not
          # from $HOME, and no ssh configuration of the runner's applies.
          dir=$(mktemp -d)
          trap 'rm -rf "$dir"' EXIT
          (umask 077 && printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$dir/key")
          printf '%s\n' "$KNOWN_HOSTS" | tr -d '\r' > "$dir/known_hosts"
          # The server runs aishie-web-deploy with the release ID, and
          # nothing else; the build goes on its standard input. After --,
          # ssh reads no option, before the destination or after it.
          ssh -F /dev/null -i "$dir/key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$dir/known_hosts" -o GlobalKnownHostsFile=/dev/null \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            -- "$TARGET" "$ID" < "$RUNNER_TEMP/build/web.tar.gz"
      - name: The site serves it
        if: steps.target.outputs.configured == 'true'
        env:
          ENVIRONMENT: ${{ needs.plan.outputs.environment }}
          SITE: ${{ steps.target.outputs.site }}
          ENTRY: ${{ needs.plan.outputs.entry }}
          ID: ${{ needs.plan.outputs.id }}
        run: |
          # index.html is served no-cache; a proxy in front may still take a
          # moment to let go of the old one.
          served=
          for _ in $(seq 1 20); do
            if page=$(curl -fsS --max-time 10 "$SITE/?release=$ID") && grep -qF "src=\"$ENTRY\"" <<< "$page"; then
              served=1
              break
            fi
            sleep 3
          done
          [ -n "$served" ] \
            || { echo "::error::$SITE/ does not serve release $ID: its index.html does not load $ENTRY (docs/deploying.md, The site does not serve the new build)"; exit 1; }
          curl -fsS --max-time 10 -o /dev/null "$SITE$ENTRY" || { echo "::error::$SITE$ENTRY is not there"; exit 1; }
          cache=$(curl -fsS --max-time 10 -o /dev/null -D - "$SITE/" | tr -d '\r' | sed -n 's/^[Cc]ache-[Cc]ontrol: *//p')
          [[ $cache == *no-cache* ]] \
            || echo "::warning::$SITE/ comes with Cache-Control: ${cache:-none}, not no-cache: browsers may keep an old index.html after a deploy (deploy/setup-web.sh has the site block)"
          # Core, behind the same origin: its routes must not fall through to
          # the app's index.html. Core's own deploy, from its repository,
          # restarts it, and Caddy answers 502 until it is back: that is
          # waited out, for two minutes, and not taken for a wrong route.
          health=$RUNNER_TEMP/health.json
          status=
          for _ in $(seq 1 40); do
            rm -f "$health"
            code=$(curl -sS --max-time 10 -o "$health" -w '%{http_code}' "$SITE/healthz" 2>/dev/null) || code=000
            status=$(jq -r '.status // empty' "$health" 2>/dev/null || true)
            [ -z "$status" ] || break
            case $code in
              000 | 502 | 503 | 504) sleep 3 ;;
              *) break ;;
            esac
          done
          if [ -z "$status" ]; then
            case $code in
              000 | 502 | 503 | 504)
                echo "::error::The front end is deployed, but Core does not answer behind $SITE: /healthz gave HTTP $code for two minutes. Is Core running, or is its own deploy under way? (docs/deploying.md, Core does not answer)" ;;
              *)
                echo "::error::$SITE/healthz did not reach Core (HTTP $code, and not Core's answer): /v1, /mcp and /healthz must go to Core (deploy/setup-web.sh has the site block)" ;;
            esac
            exit 1
          fi
          [ "$status" = ok ] || echo "::warning::Core answers at $SITE/healthz, but says it is $status (HTTP $code): $(head -c 300 "$health")"
          echo "Deployed release $ID to $ENVIRONMENT: $SITE serves it, and Core answers behind it ($status)." | tee -a "$GITHUB_STEP_SUMMARY"
