name: Publish

# A green push to main, published as an image for the compose stack
# (AIShie-Deploy). ci.yml calls this once every check on the commit has
# passed, and nothing else does.
#
# It builds the image of the commit CI checked, tests it (scripts/test-image.sh)
# against the build those checks passed, and only then pushes it as
# :sha-<commit>. If that commit is still main's tip, it moves :edge to it; a
# run that main has moved past publishes its image and stops there, so :edge
# never goes backwards. Edge's SSH deploy (deploy.yml) is ci.yml's, as
# before, until the stack takes its place.

on:
  workflow_call:

permissions:
  contents: read

# Each run block is bash with -o pipefail: a pipeline fails when any command
# in it does, not only when its last one does.
defaults:
  run:
    shell: bash

env:
  IMAGE: ghcr.io/aishie-education/aishie-frontend

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # One at a time. A newer commit waits for the one being published rather
    # than cutting it off half way through moving :edge. Of the commits
    # waiting, GitHub keeps the newest and cancels the others, which are then
    # not published: main's tip has what they had.
    concurrency:
      group: publish-main
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write # push to GHCR
    outputs:
      image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
      tip: ${{ steps.edge.outputs.tip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # git describe needs the tags
      # The tag is the commit's first seven hex digits, exactly: git's own
      # short form grows once seven are ambiguous.
      - id: meta
        name: Version and commit
        run: |
          {
            echo "version=$(git describe --tags --always)"
            echo "commit=${GITHUB_SHA:0:7}"
          } | tee -a "$GITHUB_OUTPUT"
      # The build CI checked, which the image must serve file for file.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-${{ github.sha }}
          path: ${{ runner.temp }}/dist
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # For this machine's Docker, to be tested before anything is pushed. The
      # push below builds the same again and takes this build's layers from
      # the builder's cache.
      - name: Build for the test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: aishie-frontend:test
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
          provenance: false
      - name: Test the image
        env:
          EXPECT_VERSION: ${{ steps.meta.outputs.version }}
          EXPECT_COMMIT: ${{ steps.meta.outputs.commit }}
          EXPECT_REVISION: ${{ github.sha }}
          EXPECT_SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: scripts/test-image.sh aishie-frontend:test "$RUNNER_TEMP/dist"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ steps.meta.outputs.commit }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
          provenance: mode=max
          sbom: true
      # The image pushed is the one tested: the same layers, for this
      # machine's architecture. Built twice, it is the builder's cache that
      # makes them so, and this says that it did, before :edge moves to it.
      - name: The image pushed is the image tested
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          tested=$(docker image inspect aishie-frontend:test --format '{{json .RootFS.Layers}}' | jq -c .)
          pushed=$(docker buildx imagetools inspect "$IMAGE@$DIGEST" --format '{{json (index .Image "linux/amd64").RootFS.DiffIDs}}' | jq -c .)
          [ "$tested" = "$pushed" ] \
            || { echo "::error::$IMAGE@$DIGEST is not the image tested: its linux/amd64 layers are $pushed, the tested one's $tested"; exit 1; }
      - id: edge
        name: Move :edge, if this is still main's tip
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          COMMIT: ${{ steps.meta.outputs.commit }}
        run: |
          tip=$(git ls-remote origin refs/heads/main | cut -f1)
          [ -n "$tip" ] || { echo "::error::origin has no main to compare with"; exit 1; }
          if [ "$tip" = "$GITHUB_SHA" ]; then
            docker buildx imagetools create --tag "$IMAGE:edge" "$IMAGE@$DIGEST"
            echo "tip=true" >> "$GITHUB_OUTPUT"
            moved=", and :edge is it"
          else
            echo "main has moved on to $tip; its own run moves :edge"
            echo "tip=false" >> "$GITHUB_OUTPUT"
            moved="; main has moved on to $tip, so :edge is left to that commit's run"
          fi
          echo "Published \`$IMAGE:sha-$COMMIT\` (\`$DIGEST\`)$moved." >> "$GITHUB_STEP_SUMMARY"
