version: 2
updates:
  # Minor and patch updates in one pull request a week; a major one gets its
  # own. The Core the tests run against (.github/core-image) is moved by hand,
  # with the catalogue it brings.
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      npm-dependencies:
        update-types: [minor, patch]
    ignore:
      # vue-tsc, which type-checks the .vue files, runs TypeScript's compiler
      # from JavaScript (typescript/lib/tsc). TypeScript 7, the native port,
      # no longer ships it, so `npm run typecheck` cannot start under it,
      # although vue-tsc's peer range still admits it. Stay on 6.x until
      # vue-tsc runs on 7; then drop this and move "typescript" by hand.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  # The images the Dockerfile builds from: Caddy's, the Alpine it is built on,
  # and Node. Node's major version is .nvmrc's, and moves with it, by hand.
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
