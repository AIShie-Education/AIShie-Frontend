<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- Images load from this origin only: Markdown written by students and agents must not
         call out to other hosts (utils/markdown.ts turns such images into links; this is the backstop). -->
    <meta http-equiv="Content-Security-Policy" content="img-src 'self' data: blob:" />
    <title>AIShiteru</title>
    <script>
      // The theme chosen in this browser (stores/ui.ts keeps it from here on), applied before
      // anything paints, so that neither the loading screen nor the page flashes the other one.
      ;(function () {
        var theme = 'auto'
        try {
          theme = localStorage.getItem('aishiteru.theme') || 'auto'
        } catch (e) {
          /* no storage: follow the system */
        }
        var dark =
          theme === 'dark' ||
          (theme !== 'light' && !!window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.setAttribute('data-boot-theme', dark ? 'dark' : 'light')
      })()
    </script>
    <style>
      /* The loading screen in #app, until the app mounts over it (main.ts). Plain CSS, here:
         nothing else has loaded yet. */
      .boot {
        --boot-bg: #ffffff;
        --boot-fg: #303133;
        --boot-track: #ebeef5;
        --boot-bar: #409eff;
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: var(--boot-bg);
        color: var(--boot-fg);
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans TC',
          'Helvetica Neue', Arial, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        html:not([data-boot-theme]) .boot {
          --boot-bg: #111214;
          --boot-fg: #e5eaf3;
          --boot-track: #2b2d31;
        }
      }
      html[data-boot-theme='dark'] .boot {
        --boot-bg: #111214;
        --boot-fg: #e5eaf3;
        --boot-track: #2b2d31;
      }
      /* A quick load shows only the background; the rest fades in if it takes a moment. */
      .boot__inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        animation: boot-in 0.3s ease 0.2s both;
      }
      .boot__brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.2px;
      }
      .boot__bar {
        position: relative;
        width: 160px;
        max-width: 60vw;
        height: 3px;
        border-radius: 3px;
        overflow: hidden;
        background: var(--boot-track);
      }
      .boot__bar::after {
        content: '';
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 40%;
        border-radius: 3px;
        background: var(--boot-bar);
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes boot-slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot__inner,
        .boot__bar::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot" role="status" aria-busy="true" aria-label="AIShiteru">
        <div class="boot__inner">
          <div class="boot__brand">
            <img src="/favicon.svg" alt="" width="32" height="32" />
            <span>AIShiteru</span>
          </div>
          <div class="boot__bar"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
