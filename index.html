<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#22407A" />
    <!-- Images load from this origin only: Markdown written by students and agents must not
         call out to other hosts (utils/markdown.ts turns such images into links; this is the backstop). -->
    <meta http-equiv="Content-Security-Policy" content="img-src 'self' data: blob:" />
    <title>AIshie</title>
    <meta name="application-name" content="AIshie" />
    <script>
      // The theme chosen in this browser (stores/ui.ts keeps it from here on), applied before
      // anything paints, so that neither the loading screen nor the page flashes the other one.
      ;(function () {
        var theme = 'auto'
        try {
          theme = localStorage.getItem('aishiteru.theme') || 'auto'
        } catch (e) {
          /* no storage: follow the system */
        }
        var dark =
          theme === 'dark' ||
          (theme !== 'light' && !!window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.setAttribute('data-boot-theme', dark ? 'dark' : 'light')
      })()
      // The app's own code did not load (the connection, or a deploy between this page and its
      // scripts): the loading screen says so, in both languages, instead of loading for ever.
      // Once the app has mounted over the loading screen, this does nothing.
      window.addEventListener(
        'error',
        function (e) {
          var el = e.target
          var boot = document.querySelector('#app .boot')
          if (!el || el.tagName !== 'SCRIPT' || !boot) return
          boot.setAttribute('aria-busy', 'false')
          boot.classList.add('boot--failed')
        },
        true,
      )
    </script>
    <style>
      /* The loading screen in #app, until the app mounts over it (main.ts). Plain CSS, here:
         nothing else has loaded yet; its colours are the brand's (src/styles/tokens.css). */
      .boot {
        --boot-bg: #f6f3ec;
        --boot-fg: #1b1d24;
        --boot-track: #e2ddd1;
        --boot-bar: #22407a;
        --boot-on-bar: #ffffff;
        --boot-wordmark: #22407a;
        --boot-halo: #f0d8c0;
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: var(--boot-bg);
        color: var(--boot-fg);
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans TC',
          'Helvetica Neue', Arial, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        html:not([data-boot-theme]) .boot {
          --boot-bg: #10131c;
          --boot-fg: #eeeae1;
          --boot-track: #2b3245;
          --boot-bar: #9db3e6;
          --boot-on-bar: #10131c;
          --boot-wordmark: #ffffff;
          --boot-halo: #a8704f;
        }
      }
      html[data-boot-theme='dark'] .boot {
        --boot-bg: #10131c;
        --boot-fg: #eeeae1;
        --boot-track: #2b3245;
        --boot-bar: #9db3e6;
        --boot-on-bar: #10131c;
        --boot-wordmark: #ffffff;
        --boot-halo: #a8704f;
      }
      /* A quick load shows only the background; the rest fades in if it takes a moment. */
      .boot__inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        animation: boot-in 0.3s ease 0.2s both;
      }
      /* The wordmark, as src/components/AppWordmark.vue draws it. */
      .boot__wordmark {
        display: block;
        height: 34px;
        width: auto;
        color: var(--boot-wordmark);
      }
      .boot__halo {
        fill: var(--boot-halo);
      }
      .boot__light {
        fill: #e0934f;
      }
      .boot__bar {
        position: relative;
        width: 160px;
        max-width: 60vw;
        height: 3px;
        border-radius: 3px;
        overflow: hidden;
        background: var(--boot-track);
      }
      .boot__bar::after {
        content: '';
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 40%;
        border-radius: 3px;
        background: var(--boot-bar);
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes boot-slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      /* Instead of the bar when the app cannot start: main.ts, or the script above, shows it. */
      .boot__failed {
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        max-width: 360px;
        text-align: center;
      }
      .boot--failed .boot__bar {
        display: none;
      }
      .boot--failed .boot__failed {
        display: flex;
      }
      .boot__failed-title {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
      }
      .boot__failed-text {
        margin: 0;
        font-size: 14px;
        line-height: 1.6;
        text-align: center;
      }
      .boot__en {
        display: block;
      }
      .boot__retry {
        padding: 8px 20px;
        border: 0;
        border-radius: 8px;
        background: var(--boot-bar);
        color: var(--boot-on-bar);
        font: inherit;
        font-size: 14px;
        cursor: pointer;
      }
      .boot__retry:focus-visible {
        outline: 2px solid var(--boot-bar);
        outline-offset: 2px;
      }
      @media (prefers-reduced-motion: reduce) {
        .boot__inner,
        .boot__bar::after {
          animation: none;
        }
      }
    </style>
    <noscript>
      <style>
        .boot__bar {
          display: none;
        }
      </style>
    </noscript>
  </head>

          <div class="boot__bar"></div>

            <button type="button" class="boot__retry" onclick="location.reload()">
